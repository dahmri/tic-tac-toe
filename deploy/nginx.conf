# nginx site config for production, used by the `web` Docker image.
# Serves the site's files and forwards /api and /ws to the game server
# (the `api` service in compose.yaml). See docs/DEPLOYMENT.md.

# Keep the protocol an outer proxy or load balancer saw (https), if any
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# WebSocket upgrade for /ws
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A TLS proxy in front (Caddy on the same machine, or a load balancer
    # in the same network) reaches nginx from a private address: take the
    # player's address from the X-Forwarded-For it adds, so rate limits
    # count each player, not the proxy. Only the last entry is used (the
    # one the proxy wrote), and connections from public addresses are
    # never trusted, so a player can't pick an address of their own.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    # Small static files: always revalidate so a deploy is picked up at once
    add_header Cache-Control "no-cache" always;

    # Security headers (the Content-Security-Policy lives in index.html)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Docker's DNS, re-resolved every 10s so scaled-up api containers are
    # found. Outside Docker, point $api at your server instead.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host; # with the port, to match the Origin check
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        client_max_body_size 16k;
        # The api sets its own Cache-Control: no-store
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /ws {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host; # with the port, to match the Origin check
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # The app manifest (nginx's default types may not know .webmanifest)
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    # Never serve hidden files such as .git or .env
    location ~ /\. {
        deny all;
    }
}
