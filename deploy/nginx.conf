# nginx site config for production. Used by the Docker image, and can be
# copied to a plain nginx server (adjust `root`). See docs/DEPLOYMENT.md.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Small static files: always revalidate so a deploy is picked up at once
    add_header Cache-Control "no-cache" always;

    # Security headers (the Content-Security-Policy lives in index.html)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Never serve hidden files such as .git or .env
    location ~ /\. {
        deny all;
    }
}
