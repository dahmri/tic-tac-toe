name: CI

# Runs on every pull request and on pushes to dev. The Deploy workflow
# calls it before deploying test and main, so nothing ships untested.
on:
  pull_request:
  push:
    branches: [dev]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Integration tests run the API against real databases
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tictactoe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tictactoe_test
          TEST_REDIS_URL: redis://localhost:6379/15
      - run: npm run build

  e2e:
    name: Browser tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Test the production images (nginx + game server + PostgreSQL + Redis)
      # with Docker Compose, not a dev server
      - name: Start the stack
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "GIT_COMMIT=${{ github.sha }}"
            # The stack is served over plain http, and every test signs up
            echo "COOKIE_SECURE=false"
            echo "RATE_LIMITS=off"
            # No real email: the tests read confirmation links from the outbox
            echo "SITE_URL=http://127.0.0.1:8080"
            echo "MAIL_OUTBOX=on"
          } > .env
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/version.json
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS http://127.0.0.1:8080/ | grep -q "<title>Pencil Tic-Tac-Toe</title>"
      - name: Run browser tests against the stack
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
