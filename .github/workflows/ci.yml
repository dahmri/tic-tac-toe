name: CI

# Runs on every pull request and on pushes to dev. The Deploy workflow
# calls it before deploying test and main, so nothing ships untested.
on:
  pull_request:
  push:
    branches: [dev]
  workflow_call:
  # Started on main by the Deploy workflow after a release, so the checks
  # show on main's commit for the PR that brings the release into test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Integration tests run the API against real databases
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tictactoe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tictactoe_test
          TEST_REDIS_URL: redis://localhost:6379/15
      - run: npm run build

  # Runs alongside the quality job, not after it: it doesn't need it, and
  # a pull request waits for the slower of the two instead of both
  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The browser download is cached per Playwright version; the system
      # libraries it needs are installed either way
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Test the production images (nginx + game server + PostgreSQL + Redis)
      # with Docker Compose, not a dev server
      - name: Start the stack
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "GIT_COMMIT=${{ github.sha }}"
            # The stack is served over plain http, and every test signs up
            echo "COOKIE_SECURE=false"
            echo "RATE_LIMITS=off"
            # No real email: the tests read confirmation links from the outbox
            echo "SITE_URL=http://127.0.0.1:8080"
            echo "MAIL_OUTBOX=on"
            # The weekly arena runs all day, so its test can play
            echo "ARENA_ALWAYS=on"
            # An easy sign-up puzzle: the tests sign up many players
            echo "SIGNUP_CHALLENGE_BITS=4"
            echo "SIGNUP_CHALLENGE_MIN_MS=0"
          } > .env
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/version.json
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS http://127.0.0.1:8080/ | grep -q "<title>Pencil Tic-Tac-Toe</title>"
      - name: Run browser tests against the stack
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
