name: Deploy

# test -> staging environment, main -> production environment.
# Each deploy first runs the full CI suite. Deploys are skipped with a
# notice until a server is configured: see docs/DEPLOYMENT.md.
on:
  push:
    branches: [test, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    needs: ci
    if: github.ref_name == 'main' || github.ref_name == 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Skip upload (no server configured)
        if: env.DEPLOY_HOST == ''
        run: echo "::notice title=Deploy skipped::No DEPLOY_HOST secret on this environment yet. See docs/DEPLOYMENT.md."

      # The server builds and starts the images with Docker Compose
      - name: Upload to server and restart
        if: env.DEPLOY_HOST != ''
        run: scripts/deploy.sh
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Check the site serves this commit
        if: env.DEPLOY_HOST != '' && env.SITE_URL != ''
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "$SITE_URL/version.json" | grep -q "${GITHUB_SHA::7}"; then
              echo "Live: $SITE_URL"; exit 0
            fi
            sleep 3
          done
          echo "::error::$SITE_URL/version.json does not report commit ${GITHUB_SHA::7}"
          exit 1

  release:
    name: Tag release
    needs: deploy
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create tag and GitHub release for a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; bump the version in package.json to release again."
            exit 0
          fi
          # Release notes: this version's section of CHANGELOG.md
          notes=$(awk -v v="$version" 'index($0, "## [" v "]") == 1 { on = 1; next } /^## \[/ { on = 0 } on' CHANGELOG.md)
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes "${notes:-Release $tag}"

  # After a release, main has a merge commit that test doesn't, and branch
  # protection wants PRs up to date with their base: the next test -> main
  # PR would be stuck until test catches up. This brings main back into
  # test straight away, through a PR like any other change.
  #
  # Needs the repository setting "Allow GitHub Actions to create and approve
  # pull requests" (Settings > Actions > General). Without it, the job
  # leaves a notice and the sync is done by hand.
  sync-test:
    name: Bring the release into test
    needs: release
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Open and merge main -> test
        run: |
          git fetch -q origin test
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/test; then
            echo "test already has this release."
            exit 0
          fi
          manual="gh pr create --base test --head main --title 'chore: merge main into test' --body 'After the release.'"
          # The PR's head is main's commit: the required checks must run there
          if ! gh workflow run ci.yml --ref main; then
            echo "::notice title=Bring main into test by hand::Could not start CI on main. Run: $manual"
            exit 0
          fi
          if ! url=$(gh pr create --base test --head main --title "chore: merge main into test" \
              --body "Brings the release's merge commit into test (no file changes), so the next test → main PR is up to date. Opened by the Deploy workflow."); then
            echo "::notice title=Bring main into test by hand::GitHub Actions may not open pull requests yet (see the comment on this job). Run: $manual"
            exit 0
          fi
          echo "Opened $url; merging once its checks pass."
          for _ in $(seq 1 80); do
            if gh pr merge "$url" --merge 2>/dev/null; then
              echo "Merged $url"
              exit 0
            fi
            sleep 30
          done
          echo "::warning title=Not merged::$url is still open: merge it once its checks pass."
