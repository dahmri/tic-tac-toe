<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A hand-drawn tic-tac-toe game: play the computer or a friend.">
  <title>Pencil Tic-Tac-Toe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="sheet">
  <header>
    <h1>Tic-<span class="x">Tac</span>-<span class="o">Toe</span></h1>
    <p class="sub">Three in a row wins. Nobody wins? That's a cat's game.</p>
  </header>

  <div class="controls">
    <div class="seg" role="group" aria-label="Opponent">
      <button id="mode-cpu" type="button" data-mode="cpu" aria-pressed="true">vs Computer</button>
      <button id="mode-pvp" type="button" data-mode="pvp" aria-pressed="false">2 Players</button>
    </div>
    <div class="seg" role="group" aria-label="Difficulty" id="diffGroup">
      <button id="diff-casual" type="button" data-diff="casual" aria-pressed="true">Casual</button>
      <button id="diff-hard" type="button" data-diff="hard" aria-pressed="false">Unbeatable</button>
    </div>
  </div>

  <p class="status" id="status" aria-live="polite"></p>

  <div class="board" id="board">
    <svg class="gridlines" viewBox="0 0 300 300" aria-hidden="true">
      <path d="M101 6 C98 80 103 190 99 294" />
      <path d="M199 8 C202 100 197 210 201 292" />
      <path d="M6 100 C90 97 200 103 294 99" />
      <path d="M8 201 C110 203 190 197 292 200" />
    </svg>
    <svg class="winline" id="winline" viewBox="0 0 300 300" aria-hidden="true"></svg>
  </div>

  <section class="scores" aria-label="Score">
    <div class="score sx"><span class="who" id="lblX">You · X</span><div class="tally" id="tX"></div></div>
    <div class="score so"><span class="who" id="lblO">Computer · O</span><div class="tally" id="tO"></div></div>
    <div class="score sd"><span class="who">Cat's games</span><div class="tally" id="tD"></div></div>
  </section>

  <div class="actions">
    <button id="next" type="button" class="primary">New round</button>
    <button id="reset" type="button" class="ghostbtn">Wipe scores</button>
  </div>
  <p class="hint">Tip: press <kbd>1</kbd>–<kbd>9</kbd> to play a square (keypad layout, <kbd>7</kbd> is top-left), <kbd>N</kbd> for a new round.</p>
</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
